расчётом."})]})]}),[["Как устроен конфигуратор?","Выберите один из пяти продуктов, заполните три шага и изучите результат. Цена меняется при редактировании параметров. Сохраняйте именованные сценарии, добавляйте до трёх в сравнение, скачивайте JSON или передавайте ссылку. Кредитный график доступен в CSV, а результат — через «PDF / печать» с выбором «Сохранить как PDF» в браузере."],["Это реальные предложения страховых компаний и банков?","Нет. Опора — инструмент моделирования условий. Страховые премии рассчитаны по демонстрационным ставкам; реальных предложений поставщиков и проверки страховых баз здесь нет. Кредит и лизинг считаются по введённой ставке. Оформление договора, проверка документов, андеррайтинг, оплата и отправка заявки не подключены."],["Как работает франшиза в КАСКО?","В этом конфигураторе моделируется безусловная франшиза: выбранная часть каждого убытка оплачивается самостоятельно. Более высокая франшиза уменьшает расчётную премию. В базовой программе смоделированы угон и полная гибель, в оптимальной — также ущерб и ДТП, в максимальной — дополнительные риски. Точные исключения и правила выплаты всегда определяются договором страховщика."],["Что влияет на стоимость ОСАГО?","Демонстрационная формула: базовая ставка × территория × мощность × КБМ × возраст/допуск × период × использование. При нескольких водителях модель выбирает наибольший КБМ и возрастной риск; мультидрайв использует отдельные примеры коэффициентов. Это упрощённая модель без актуальной нормативной тарифной сетки: не используйте полученную сумму как цену оформления реального полиса."],["Как считается страховка для путешествия?","В модели стоимость зависит от территории, количества дней, возрастов, лимита медицинского покрытия, цели поездки и опций. Даты считаются включительно. Для многократных поездок используется выбранное общее число дней покрытия за год. Медицинский лимит задан в евро, тариф модели — в рублях; конвертации по текущему курсу нет."],["Аннуитетный или дифференцированный график?","Аннуитет распределяет погашение на равные регулярные платежи. Дифференцированный график равномерно погашает основной долг, а проценты на остаток уменьшаются. Месячная ставка здесь равна годовой / 12; ежедневные проценты и фактические календарные даты не учитываются. Последний платёж корректируется на остаток. Досрочное погашение выполняется после очередного платежа, с уменьшением срока или будущего платежа."],["Что включено в полную сумму расходов?","В первоначальный взнос добавляются весь возвращаемый долг, проценты, единовременная комиссия и указанное страхование за весь срок. Комиссия и страховка считаются отдельными платежами при оформлении. Это сумма расходов в рублях, а не регуляторная полная стоимость кредита (ПСК). Для лизинга выкуп включён в последний платёж; расчёт НДС, налоговых вычетов и бухгалтерского эффекта не выполняется."],["Где хранятся данные?","Черновики, сравнение и сохранённые расчёты хранятся в localStorage этого браузера. Они не отправляются на сервер и не синхронизируются между устройствами. Очистка данных браузера удалит их — сохраните JSON для резервной копии. Ссылка содержит параметры в закодированном, но не зашифрованном виде: делитесь ею только с нужными людьми."]].map(([e,n],t)=>s.jsxs("details",{className:"faq-item",open:t===0?!0:void 0,children:[s.jsxs("summary",{children:[e,s.jsx(_,{name:"plus",size:18})]}),s.jsx("p",{children:n})]},e))]}),s.jsxs("aside",{children:[s.jsxs("div",{className:"guide-source",children:[s.jsx("span",{className:"eyebrow",children:"ПРОВЕРЕННЫЕ ИСТОЧНИКИ"}),s.jsx("h3",{children:"Понимать больше"}),s.jsx("p",{children:"Дополнительная информация о реальных финансовых продуктах."}),s.jsxs("a",{href:"https://www.cbr.ru/faq/insh/osago/",target:"_blank",rel:"noreferrer",children:["ОСАГО: вопросы и ответы",s.jsxs("span",{children:["Банк России ",s.jsx(_,{name:"arrow",size:15})]})]}),s.jsxs("a",{href:"https://fincult.info/",target:"_blank",rel:"noreferrer",children:["Финансовая грамотность",s.jsxs("span",{c
